apiVersion: policies.kyverno.io/v1beta1
kind: NamespacedValidatingPolicy
metadata:
  name: require-image-digests
  namespace: lab404
spec:
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: []
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(container, container.image.contains('@sha256:')) &&
        (!has(object.spec.initContainers) ||
        object.spec.initContainers.all(container, container.image.contains('@sha256:'))) &&
        (!has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(container, container.image.contains('@sha256:')))
      message: Every container image must use a sha256 digest.
---
apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: verify-lab404-images
spec:
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: []
  validationConfigurations:
    mutateDigest: false
    required: true
    verifyDigest: true
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: ghcr.io/proxyfil/lab404-web@sha256:*
    - glob: ghcr.io/proxyfil/lab404-votes@sha256:*
  attestors:
    - name: github_actions
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/Proxyfil/lab404/.github/workflows/images.yml@refs/heads/main
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.github_actions])).all(e, e > 0) &&
        images.initContainers.map(image, verifyImageSignatures(image, [attestors.github_actions])).all(e, e > 0) &&
        images.ephemeralContainers.map(image, verifyImageSignatures(image, [attestors.github_actions])).all(e, e > 0)
      message: Lab404 images must be signed by the main GitHub Actions workflow.
