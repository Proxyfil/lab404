name: Build images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  TRIVY_VERSION: v0.76.1

jobs:
  hadolint:
    name: Hadolint ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Lint Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1 \
            < "apps/${{ matrix.service }}/Dockerfile"

  build:
    name: Build ${{ matrix.service }} for ${{ matrix.target.arch }}
    needs: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        run: echo "name=${REGISTRY}/${IMAGE_OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push platform digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.service }}
          platforms: ${{ matrix.target.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export platform digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          printf '%s\n' "$digest" > "/tmp/digests/${digest#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Trivy ${{ matrix.service }} for ${{ matrix.target.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digests

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - id: image
        name: Set image name
        run: echo "name=${REGISTRY}/${IMAGE_OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Scan exact platform digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PLATFORM: ${{ matrix.target.platform }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p evidence
          digest="$(cat /tmp/digests/*)"
          image="${IMAGE}@${digest}"
          trivy image \
            --platform "${PLATFORM}" \
            --scanners vuln \
            --format json \
            --output "evidence/${{ matrix.service }}-${{ matrix.target.arch }}-trivy.json" \
            "${image}"
          trivy image \
            --platform "${PLATFORM}" \
            --scanners vuln \
            --format cyclonedx \
            --output "evidence/${{ matrix.service }}-${{ matrix.target.arch }}.cdx.json" \
            "${image}"
          trivy image \
            --platform "${PLATFORM}" \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${image}"

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.service }}-${{ matrix.target.arch }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1

  dockle:
    name: Dockle ${{ matrix.service }} for ${{ matrix.target.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        target:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.target.arch }}
          path: /tmp/digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        run: echo "name=${REGISTRY}/${IMAGE_OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Scan exact platform digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PLATFORM: ${{ matrix.target.platform }}
          LOCAL_IMAGE: lab404-scan-${{ matrix.service }}-${{ matrix.target.arch }}:digest
        run: |
          digest="$(cat /tmp/digests/*)"
          mkdir -p evidence
          docker pull --platform "${PLATFORM}" "${IMAGE}@${digest}"
          docker tag "${IMAGE}@${digest}" "${LOCAL_IMAGE}"
          dockle_args=()
          if [ "${{ matrix.service }}" = "web" ]; then
            dockle_args+=(--accept-key --access-logfile)
          fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/evidence:/evidence" \
            goodwithtech/dockle:v0.4.15 \
            --exit-code 1 \
            --format json \
            --output "/evidence/${{ matrix.service }}-${{ matrix.target.arch }}-dockle.json" \
            "${dockle_args[@]}" \
            "${LOCAL_IMAGE}"

      - name: Upload Dockle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockle-${{ matrix.service }}-${{ matrix.target.arch }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }} OCI index
    needs: [trivy, dockle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        run: echo "name=${REGISTRY}/${IMAGE_OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Create immutable commit tag
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_TAG: sha-${{ github.sha }}
        run: |
          digest_args=()
          for digest_file in *; do
            digest_args+=( "${IMAGE}@sha256:${digest_file}" )
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${COMMIT_TAG}" \
            "${digest_args[@]}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              "${digest_args[@]}"
          fi
          docker buildx imagetools inspect "${IMAGE}:${COMMIT_TAG}"

      - name: Export published index digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_TAG: sha-${{ github.sha }}
        run: |
          mkdir -p /tmp/index-digests
          digest="$(docker buildx imagetools inspect "${IMAGE}:${COMMIT_TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          printf '%s\n' "$digest" > "/tmp/index-digests/${{ matrix.service }}.txt"

      - name: Upload published index digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-digests-${{ matrix.service }}
          path: /tmp/index-digests/*
          if-no-files-found: error
          retention-days: 1

  evidence:
    name: Upload image evidence
    needs: [publish, trivy, dockle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: evidence
          merge-multiple: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-security-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  sign:
    name: Sign and verify ${{ matrix.service }} image
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-digests-${{ matrix.service }}
          path: /tmp/index-digests

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Set image name
        run: echo "name=${REGISTRY}/${IMAGE_OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Sign image index and platform manifests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COSIGN_YES: "true"
        run: |
          digest="$(cat /tmp/index-digests/${{ matrix.service }}.txt)"
          cosign sign --recursive "${IMAGE}@${digest}"

      - name: Verify image index and platform manifests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/images.yml@refs/heads/main
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          digest="$(cat /tmp/index-digests/${{ matrix.service }}.txt)"
          verify_args=(
            --certificate-identity "${WORKFLOW_IDENTITY}"
            --certificate-oidc-issuer "${OIDC_ISSUER}"
          )
          cosign verify "${verify_args[@]}" "${IMAGE}@${digest}"
          mapfile -t child_digests < <(
            docker buildx imagetools inspect "${IMAGE}@${digest}" --raw |
              jq -r '.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .digest'
          )
          test "${#child_digests[@]}" -eq 2
          for child_digest in "${child_digests[@]}"; do
            cosign verify "${verify_args[@]}" "${IMAGE}@${child_digest}"
          done
