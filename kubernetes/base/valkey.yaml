apiVersion: v1
kind: Secret
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: lab404
type: Opaque
stringData:
  password: insecure-lab-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: lab404
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: lab404
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        lab404.io/workload: stateful
      tolerations:
        - key: workload
          operator: Equal
          value: stateful
          effect: NoSchedule
      containers:
        - name: valkey
          image: valkey/valkey:8.1.1-alpine@sha256:6a57d58c0a37cf7acc3045ac0fd6dd91be339774106ab4d9ca088013a096a99f
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ['exec valkey-server --requirepass "$VALKEY_PASSWORD"']
          securityContext:
            runAsUser: 999
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: valkey-data
              mountPath: /data
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
      volumes:
        - name: valkey-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: lab404
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
